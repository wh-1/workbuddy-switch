[package]
name = "wb-switch-rust"
version = "0.1.34"
description = "wb-switch —— WorkBuddy 账号切换工具（Rust/Tauri 版）"
authors = ["apple"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "wb_switch_rust_lib"
# 桌面版只需 rlib。staticlib/cdylib 仅移动端需要，且 Windows GNU debug 构建的
# cdylib 会导出 14 万+ 符号，超过 ld/lld 的 65535 ordinal 上限直接链接失败。
# 若要做 iOS/Android 构建，把 staticlib/cdylib 加回来。
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
wb-switch-core = { path = "../crates/wb-switch-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2.7.2"

# 系统自启（开机静默启动）：仅桌面目标支持（macOS / Windows / Linux）。
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSImage", "NSWorkspace"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSData", "NSString"] }
