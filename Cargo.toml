[workspace]
members = ["crates/wb-switch-core", "crates/wb-switch-server", "src-tauri"]
resolver = "2"

# 压缩 dev 构建产物（2026-09-24）：
# MSVC 下 dev 默认 debuginfo=2（完整符号），pdb 是 target 膨胀的主因之一
# —— 实测旧 target/debug 曾到 14G，其中 deps 里的 pdb 单独占 1.9G。
# `line-tables-only` 只保留行号表：panic 堆栈仍有文件名/行号可读，
# 但去掉变量类型等重信息 ⇒ 体积与编译时间都降一档。
# 需要看局部变量时用 `RUSTFLAGS="-C debuginfo=2"` 临时覆盖，别改回默认值。
[profile.dev]
debug = "line-tables-only"
